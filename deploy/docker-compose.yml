services:
  clashlens:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: clashlens
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
    environment:
      CLASHLENS_ADDR: ":8080"
      CLASHLENS_DB: "/data/clashlens.db"
      CLASHLENS_TZ_OFFSET: "480"
      TZ: "Asia/Shanghai"
      # 可选：取消注释可直接设置初始管理员密码，否则打开 Web 页面首次引导设置
      # CLASHLENS_ADMIN_PASSWORD: "your-strong-password"
