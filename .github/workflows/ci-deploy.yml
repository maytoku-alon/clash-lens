name: ClashLens CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package Server
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.meta.outputs.short_sha }}
      sha256: ${{ steps.build.outputs.sha256 }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute build metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.2.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install, typecheck & build web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web exec tsc --noEmit
          pnpm --dir web build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Run Go unit & integration tests
        env:
          CGO_ENABLED: "0"
        run: go test -count=1 -v ./...

      - name: Build static Linux amd64 server binary
        id: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X clash-lens/server/internal/config.AppVersion=${{ steps.meta.outputs.version }} -X clash-lens/server/internal/config.BuildCommit=${{ steps.meta.outputs.short_sha }} -X clash-lens/server/internal/config.BuildTime=${{ steps.meta.outputs.build_time }}"
          go build -trimpath -ldflags="$LDFLAGS" -o dist/clashlens-server-linux-amd64 ./server/cmd/server
          SHA=$(sha256sum dist/clashlens-server-linux-amd64 | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          ls -lh dist/clashlens-server-linux-amd64

      - name: Upload server binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashlens-server-linux
          path: dist/clashlens-server-linux-amd64
          retention-days: 1

  deploy:
    name: Deploy to Cloud Server
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-test
    if: github.repository == 'maytoku-alon/clash-lens' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    steps:
      - name: Download built server binary
        uses: actions/download-artifact@v4
        with:
          name: clashlens-server-linux
          path: dist

      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ] || [ -z "$DEPLOY_USER" ] || [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::error::Missing GitHub Actions Secrets: configure DEPLOY_HOST, DEPLOY_USER, and DEPLOY_SSH_KEY in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

      - name: Upload (zstd + 4-way parallel SSH), hot-reload & health-check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_APP_PORT: ${{ secrets.DEPLOY_APP_PORT }}
          DEPLOY_REMOTE_DIR: ${{ secrets.DEPLOY_REMOTE_DIR }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EXPECTED_SHA256: ${{ needs.build-and-test.outputs.sha256 }}
          EXPECTED_COMMIT: ${{ needs.build-and-test.outputs.short_sha }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          USER="${DEPLOY_USER}"
          REMOTE_DIR="${DEPLOY_REMOTE_DIR:-/home/${USER}/clashlens}"
          REMOTE_BIN="${REMOTE_DIR}/clashlens-server-linux-amd64"

          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq zstd
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          SSH_OPTS="-i ~/.ssh/deploy_key -p $PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o Compression=no -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=6"

          zstd -19 -T0 -f -o dist/server.zst dist/clashlens-server-linux-amd64
          ZST_SIZE=$(stat -c %s dist/server.zst)
          rm -rf dist/parts && mkdir -p dist/parts
          split -n 4 -d -a 2 dist/server.zst dist/parts/part_
          echo "Compressed size: ${ZST_SIZE} bytes, split into 4 chunks"

          ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "rm -rf ${REMOTE_DIR}/parts && mkdir -p ${REMOTE_DIR}/parts ${REMOTE_DIR}/data && ([ -f ${REMOTE_BIN} ] && cp -f ${REMOTE_BIN} ${REMOTE_BIN}.prev || true)"

          T_START=$(date +%s)
          upload_part() {
            local file="$1"
            local name
            name=$(basename "$file")
            for attempt in 1 2; do
              if ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "cat > ${REMOTE_DIR}/parts/${name}" < "$file"; then
                return 0
              fi
              sleep 2
            done
            return 1
          }

          PIDS=()
          for part in dist/parts/part_*; do
            upload_part "$part" &
            PIDS+=($!)
          done
          for pid in "${PIDS[@]}"; do
            wait "$pid"
          done
          T_END=$(date +%s)
          UPLOAD_SECS=$((T_END - T_START))
          echo "Parallel zstd upload finished in ${UPLOAD_SECS}s"

          REMOTE_SHA=$(ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "cat ${REMOTE_DIR}/parts/part_* | zstd -d -c > ${REMOTE_BIN}.new && rm -rf ${REMOTE_DIR}/parts && chmod +x ${REMOTE_BIN}.new && sha256sum ${REMOTE_BIN}.new | awk '{print \$1}'")
          if [ "$REMOTE_SHA" != "$EXPECTED_SHA256" ]; then
            echo "::error::Remote SHA256 mismatch: got $REMOTE_SHA, want $EXPECTED_SHA256"
            exit 1
          fi

          ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "mv -f ${REMOTE_BIN}.new ${REMOTE_BIN}"

          APP_PORT="${DEPLOY_APP_PORT:-}"
          if [ -z "$APP_PORT" ]; then
            APP_PORT=$(ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "cat ${REMOTE_DIR}/.app_port 2>/dev/null || echo 8080" | tr -d '[:space:]')
          fi
          if [ -n "$APP_PORT" ]; then
            echo "::add-mask::$APP_PORT"
          fi

          echo "Waiting for ClashLens binary watcher + 1Panel auto-restart to boot commit ${EXPECTED_COMMIT}..."
          HEALTH_JSON=""
          OK=0
          for i in $(seq 1 15); do
            sleep 2
            if HEALTH_JSON=$(ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "curl -fsS --max-time 3 http://127.0.0.1:${APP_PORT}/api/v1/health" 2>/dev/null); then
              echo "Attempt $i: $HEALTH_JSON"
              if echo "$HEALTH_JSON" | grep -q "\"ok\":true" && echo "$HEALTH_JSON" | grep -q "\"commit\":\"${EXPECTED_COMMIT}\""; then
                OK=1
                break
              fi
            else
              echo "Attempt $i: waiting for service restart..."
            fi
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::New version failed health check; rolling back to previous binary..."
            ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "if [ -f ${REMOTE_BIN}.prev ]; then mv -f ${REMOTE_BIN}.prev ${REMOTE_BIN}; fi"
            sleep 5
            ssh $SSH_OPTS "${USER}@${DEPLOY_HOST}" "curl -sS --max-time 3 http://127.0.0.1:${APP_PORT}/api/v1/health || true"
            exit 1
          fi

          {
            echo "## ClashLens 部署成功"
            echo "- **Commit**: \`${EXPECTED_COMMIT}\`"
            echo "- **Upload Time**: \`${UPLOAD_SECS}s\` (\`${ZST_SIZE}\` bytes zstd)"
            echo "- **Binary SHA256**: \`${EXPECTED_SHA256}\`"
            echo "- **Health**: \`${HEALTH_JSON}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Cross-Compile & Publish Release
    runs-on: ubuntu-latest
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Build web UI
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build all release binaries
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p release-assets
          VER="${{ needs.build-and-test.outputs.version }}"
          SHA="${{ needs.build-and-test.outputs.short_sha }}"
          BT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SRV_LDFLAGS="-s -w -X clash-lens/server/internal/config.AppVersion=${VER} -X clash-lens/server/internal/config.BuildCommit=${SHA} -X clash-lens/server/internal/config.BuildTime=${BT}"

          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="$SRV_LDFLAGS" -o release-assets/clashlens-server-linux-amd64 ./server/cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-X clash-lens/server/internal/config.AppVersion=${VER} -X clash-lens/server/internal/config.BuildCommit=${SHA} -X clash-lens/server/internal/config.BuildTime=${BT}" -o release-assets/clashlens-server-windows-amd64.exe ./server/cmd/server
          GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -X clash-lens/agent/internal/config.AppVersion=${VER}" -o release-assets/clashlens-agent-windows-amd64.exe ./agent/cmd/agent
          GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -X main.defaultLocalMode=true -X clash-lens/agent/internal/config.AppVersion=${VER} -X clash-lens/server/internal/config.AppVersion=${VER} -X clash-lens/server/internal/config.BuildCommit=${SHA} -X clash-lens/server/internal/config.BuildTime=${BT}" -o release-assets/clashlens-local-windows-amd64.exe ./agent/cmd/agent
          GOOS=windows GOARCH=amd64 go build -ldflags="-X clash-lens/agent/internal/config.AppVersion=${VER}" -o release-assets/clashlens-agent-cli-windows-amd64.exe ./agent/cmd/agent
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X clash-lens/agent/internal/config.AppVersion=${VER}" -o release-assets/clashlens-agent-linux-amd64 ./agent/cmd/agent

          (cd release-assets && sha256sum * > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
